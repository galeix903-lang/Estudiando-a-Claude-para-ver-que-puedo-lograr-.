<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de llamadas</title>
  <link rel="stylesheet" href="/shared.css" />
</head>
<body>
  <div class="landing">
    <h1 id="business-name">Sistema de llamadas</h1>
    <p class="muted">Elige qué pantalla quieres abrir en este dispositivo.</p>
    <div class="links">
      <a href="/kiosk/">Kiosco<br /><span class="muted" style="font-weight:400;font-size:0.85rem">Sacar turno</span></a>
      <a href="/panel/">Panel<br /><span class="muted" style="font-weight:400;font-size:0.85rem">Personal / atención</span></a>
      <a href="/display/">Pantalla<br /><span class="muted" style="font-weight:400;font-size:0.85rem">Vista pública</span></a>
      <a href="/admin/">Administración<br /><span class="muted" style="font-weight:400;font-size:0.85rem">Configurar el local</span></a>
    </div>
  </div>
  <script>
    fetch('/api/config').then((r) => r.json()).then((c) => {
      if (c && c.name) document.getElementById('business-name').textContent = c.name;
    });
  </script>
</body>
</html>
