<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de atencion</title>
  <link rel="stylesheet" href="/shared.css" />
  <style>
    .login-box {
      max-width: 340px;
      margin: 3rem auto;
      text-align: center;
    }
    .login-box input {
      width: 100%;
      margin: 1rem 0;
      text-align: center;
      font-size: 1.3rem;
    }
    .setup-box {
      max-width: 420px;
      margin: 2rem auto;
    }
    .service-check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0;
    }
    .current-ticket {
      text-align: center;
      padding: 2rem 1rem;
    }
    .current-ticket .code {
      font-size: 4rem;
      font-weight: 800;
      color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--panel-light);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1 id="business-name">Panel de atencion</h1>
    <div>
      <span id="whoami" class="muted" style="margin-right:1rem"></span>
      <button id="logoutBtn" class="ghost" style="display:none">Salir</button>
    </div>
  </div>
  <div class="container">
    <div id="loginView" class="login-box card">
      <h2>Ingreso del personal</h2>
      <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN" />
      <p class="error-msg" id="loginError"></p>
      <button id="loginBtn">Ingresar</button>
    </div>

    <div id="setupView" class="setup-box card" style="display:none">
      <h2>Elegi tu puesto</h2>
      <select id="counterSelect" style="width:100%;padding:0.6rem;border-radius:8px;background:#0b1220;color:var(--text);border:1px solid var(--panel-light)"></select>
      <h3 style="margin-top:1.5rem">Servicios que atendes</h3>
      <p class="muted" style="font-size:0.85rem">Si no elegis ninguno, se atienden todos.</p>
      <div id="serviceChecks"></div>
      <button id="startBtn" style="margin-top:1rem">Comenzar a atender</button>
    </div>

    <div id="workView" style="display:none">
      <div class="card current-ticket">
        <p class="muted" id="counterLabel">Puesto</p>
        <div class="code" id="currentCode">--</div>
        <p id="currentService" class="muted"></p>
        <div class="actions" id="actions"></div>
      </div>
      <div class="card">
        <h3>Cola pendiente</h3>
        <div id="stats"></div>
      </div>
      <div style="text-align:center">
        <button id="changeCounterBtn" class="ghost">Cambiar de puesto</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/panel/panel.js"></script>
</body>
</html>
